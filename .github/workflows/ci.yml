name: Code quality and security
on:
  push:
  pull_request:
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run audit
      - run: npm run check
      - run: npm run test:coverage
